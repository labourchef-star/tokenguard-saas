[project]
name = "tokenguard-saas"
version = "0.1.0"
description = "TokenGuard — hosted OpenAI-compatible proxy with loop-stop + impact dashboard"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.uv]
package = false
