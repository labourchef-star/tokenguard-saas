<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — TokenGuard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">TokenGuard</a>
      <nav class="topnav">
        <a href="/signin">Sign in</a>
        <a class="btn good" href="/app?demo=1">Try demo</a>
      </nav>
    </div>
  </header>
  <main class="auth-page">
    <form class="panel auth-box wide" method="post" action="/signup" id="signup-form">
      <h1>Create your TokenGuard account</h1>
      <p class="muted">One click into your dashboard with a personal base_url and <span class="mono">tg_</span> API key. Free for now.</p>
      <div id="err" class="form-error hidden"></div>
      <label for="name">Name (optional)</label>
      <input id="name" name="name" autocomplete="name" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
      <label for="password">Password (min 6)</label>
      <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password" />
      <button class="btn primary" type="submit">Sign up — get base URL</button>
      <p class="muted fine">Already have an account? <a href="/signin">Sign in</a>
        · or <a href="/app?demo=1">try demo without signing up</a></p>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get("error");
    if (err) {
      const el = document.getElementById("err");
      el.textContent = err;
      el.classList.remove("hidden");
    }
  </script>
</body>
</html>
